name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 逻辑自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 运行自测（失败则不部署）
        run: npm test

  smoke:
    name: 浏览器冒烟测试
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 冒烟测试（失败则不部署）
        run: npm run test:smoke

  deploy:
    name: 部署到 GitHub Pages
    needs: [test, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # 部署到 Pages
      id-token: write   # 校验部署来源
    steps:
      - uses: actions/checkout@v7
      - name: 组装站点目录（显式清单，排除 .doc 原始材料）
        run: |
          mkdir -p _site
          cp index.html test.html items.csv 404.html LICENSE _site/
      - uses: actions/configure-pages@v6
      - name: 上传站点内容
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5