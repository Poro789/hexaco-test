name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# 官方 action 全部钉到 commit SHA（防上游 tag 被移动），版本注释供 tools/test_scoring.mjs 校验
jobs:
  test:
    name: 逻辑自测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # 只需读仓库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: 运行自测（失败则不部署）
        run: npm test

  smoke:
    name: 浏览器冒烟测试
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # 只需读仓库
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 冒烟测试（失败则不部署）
        run: npm run test:smoke

  deploy:
    name: 部署到 GitHub Pages
    needs: [test, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read    # 读仓库
      pages: write      # 部署到 Pages
      id-token: write   # 校验部署来源
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 组装站点目录（显式清单，排除 .doc 原始材料）
        run: |
          mkdir -p _site
          cp index.html test.html items.csv 404.html LICENSE _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: 上传站点内容
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # 部署成功不等于线上真的换了新版：这一步把线上内容与本次提交逐字节比对，
  # 抓「CDN 还发旧的」「漏发文件」「部署到了别的路径」。脚本自带重试，Pages 生效延迟不会误报。
  verify:
    name: 线上核验（部署后）
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # 只读仓库 + 访问公开站点
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 比对线上内容与本次提交（失败则该次运行标红）
        run: node tools/test_live.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
