<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 · HEXACO 人格测试</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 27,9.5 27,22.5 16,29 5,22.5 5,9.5' fill='none' stroke='%231c1c1a' stroke-width='2'/%3E%3Cpolygon points='16,9 22,12.5 20,20 16,23 10,19 12,12' fill='%235b9a8b' fill-opacity='.35' stroke='%235b9a8b' stroke-width='2'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
    <style>
        :root {
            --bg: #f7f7f4;
            --surface: #ffffff;
            --ink: #1c1c1a;
            --muted: #6e6e66;
            --faint: #9a9a90;
            --hairline: #e7e7e1;
            --hairline-strong: #d8d8d0;
            --accent: #1c1c1a;
            --font: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Segoe UI', sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151517;
                --surface: #1d1d20;
                --ink: #eceae4;
                --muted: #9c9c94;
                --faint: #6f6f68;
                --hairline: #2c2c30;
                --hairline-strong: #3a3a3f;
                --accent: #eceae4;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.7;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .box { max-width: 460px; text-align: center; }
        .code {
            font-size: 13px;
            color: var(--faint);
            border: 1px solid var(--hairline-strong);
            border-radius: 999px;
            padding: 2px 12px;
        }
        h1 { font-size: 26px; font-weight: 650; margin-top: 18px; letter-spacing: .01em; }
        p { margin-top: 12px; color: var(--muted); font-size: 15px; }
        .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a.btn {
            display: inline-block;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 11px 26px;
            border-radius: 999px;
            transition: transform .15s ease, opacity .15s ease;
        }
        a.btn:hover { transform: translateY(-1px); opacity: .92; }
        a.primary { background: var(--accent); color: var(--bg); }
        a.ghost { border: 1px solid var(--hairline-strong); color: var(--ink); }
    </style>
</head>
<body>
    <div class="box">
        <span class="code">404</span>
        <h1 id="title">这个页面不存在</h1>
        <p id="msg">链接可能过期或输入有误。测试本身仍在原处，可直接前往。</p>
        <div class="actions">
            <a class="btn primary" href="/hexaco-test/test.html">开始测试</a>
            <a class="btn ghost" href="/hexaco-test/">返回落地页</a>
        </div>
    </div>

    <script>
        /* v1.0.3 起主文件改名为 test.html、题本改为 items.csv（去掉 URL 里的中文
           百分号编码）。GitHub Pages 对任意缺失路径都返回本文件，故可在此按
           pathname 精确重定向已知的旧地址。用 location.replace 而非 href：
           旧地址不留在历史里，返回键不会又跳回 404。
           基准路径由本文件自身位置推导，因此本地挂在 / 或线上挂在 /hexaco-test/
           都能正确工作，不硬编码子路径。 */
        (function () {
            var OLD = {
                'HEXACO测试_v1.0.2.html': 'test.html',
                'HEXACO测试_v1.0.1.html': 'test.html',
                'HEXACO测试_v1.0.0.html': 'test.html',
                'HEXACO_items.csv': 'items.csv'
            };
            var here = location.pathname;
            var base = here.slice(0, here.lastIndexOf('/') + 1); // 本文件所在目录
            var decoded;
            try { decoded = decodeURIComponent(here); } catch (e) { decoded = here; }
            var name = decoded.slice(decoded.lastIndexOf('/') + 1);
            if (OLD[name]) {
                location.replace(location.origin + base + OLD[name] + location.search + location.hash);
                return;
            }
            // 未命中：真正不存在的地址，措辞上给出上下文
            document.getElementById('msg').textContent =
                '未找到 ' + decoded + '。链接可能过期或输入有误，测试本身仍在原处。';
        })();
    </script>
</body>
</html>
